<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#74ACDF">
  <meta name="description" content="Los Topes - Show Regreso: Nada ha cambiado en nuestro parque. Set list para escuchar.">
  <title>Los Topes - Show Regreso</title>
  <link rel="icon" href="../img/favicon.png">
  <link rel="preload" href="../img/ringbearer-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'ringFont';
      src: url('../img/ringbearer-latin.woff2') format('woff2'),
           url('../img/ringbearer-latin.woff') format('woff');
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Celeste y blanco: #74ACDF (celeste bandera), texto azul oscuro para legibilidad */
    html {
      background: #fff;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none; /* evita "tirar para recargar", que cortaría la música */
    }

    /* Toques: sin zoom por doble toque, sin selección de texto ni menús al mantener apretado */
    button, .track, .progress-bar { touch-action: manipulation; }
    header, .track { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #13304d;
      background: #fff;
      padding-top: 230px; /* se ajusta por JS a la altura real del header */
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-tap-highlight-color: transparent;
    }
    body::-webkit-scrollbar { display: none; }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    /* ---------- Header ---------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: #74ACDF;
      border-bottom: 3px solid #fff;
    }

    .header-content {
      max-width: 440px;
      margin: 0 auto;
      padding: 10px 16px 8px;
      text-align: center;
    }

    .logo {
      font-family: 'ringFont', Georgia, serif;
      font-size: 1.35rem;
      line-height: 1.15;
      color: #fff;
    }

    .subtitle {
      font-family: 'ringFont', Georgia, serif;
      font-size: 0.72rem;
      margin-top: 2px;
    }
    .subtitle b { display: block; font-weight: normal; letter-spacing: 0.06em; }

    /* Tema actual: grande y legible de un vistazo */
    .now-title, .now-meta {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-title {
      margin-top: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;
      height: 1.3em;
    }
    .now-meta {
      font-size: 0.9rem;
      line-height: 1.3;
      height: 1.3em;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
    }

    .control-btn {
      width: 64px;
      height: 64px;
      margin: 0 10px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .control-btn:active { background: #e3f0fa; }
    .control-btn svg { width: 30px; height: 30px; fill: #13304d; display: block; }

    .play-pause-btn { width: 84px; height: 84px; }
    .play-pause-btn svg { width: 44px; height: 44px; }
    .icon-pause { display: none !important; }
    .is-playing .icon-play { display: none !important; }
    .is-playing .icon-pause { display: block !important; }

    /* Progreso: siempre ocupa lugar para que el header no cambie de alto */
    .progress {
      max-width: 360px;
      margin: 10px auto 0;
      visibility: hidden;
    }
    .progress.show { visibility: visible; }

    .progress-bar {
      height: 36px; /* zona táctil grande */
      position: relative;
      cursor: pointer;
    }
    .progress-track, .progress-fill {
      position: absolute;
      left: 0;
      right: 0;
      top: 13px;
      height: 10px;
      border-radius: 5px;
    }
    .progress-track { background: #b9d6ef; }
    .progress-fill {
      background: #fff;
      -webkit-transform-origin: 0 50%;
      transform-origin: 0 50%;
      -webkit-transform: scaleX(0);
      transform: scaleX(0);
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      margin-top: -4px;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Lista ---------- */
    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 4px 16px 32px;
    }

    .act {
      font-family: 'ringFont', Georgia, serif;
      font-size: 1rem;
      font-weight: normal;
      color: #3d82bf;
      text-align: center;
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
    }
    .act:before, .act:after {
      content: "";
      -webkit-box-flex: 1;
      flex: 1;
      height: 1px;
      background: #74ACDF;
    }
    .act:before { margin-right: 10px; }
    .act:after { margin-left: 10px; }
    .act-note {
      display: block;
      font-size: 0.72rem;
      text-align: center;
      opacity: 0.7;
      margin: -6px 0 10px;
    }

    .track {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff;
      border: 2px solid #cfe3f4;
      cursor: pointer;
      overflow: hidden;
    }
    .track:hover { border-color: #74ACDF; }
    .track.playing { background: #74ACDF; border-color: #74ACDF; }
    .track.extra { border-style: dashed; }
    .track.text-only { cursor: default; border-style: dashed; opacity: 0.7; }
    .track.text-only:hover { border-color: #cfe3f4; }

    .track-number {
      width: 28px;
      height: 28px;
      margin-right: 12px;
      border-radius: 50%;
      background: #e3f0fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .playing .track-number {
      background: #fff;
      -webkit-animation: pulse 2s infinite;
      animation: pulse 2s infinite;
    }

    .track-info {
      -webkit-box-flex: 1;
      flex: 1;
      min-width: 0;
      text-align: left;
    }
    .track-title {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-meta {
      font-size: 0.74rem;
      line-height: 1.3;
      opacity: 0.75;
      margin-top: 2px;
    }
    .track-note {
      font-size: 0.72rem;
      font-style: italic;
      opacity: 0.85;
      margin-top: 1px;
    }

    .badge-new {
      display: inline-block;
      vertical-align: 2px;
      margin-left: 4px;
      padding: 1px 6px;
      border-radius: 8px;
      background: #74ACDF;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .playing .badge-new { background: #fff; color: #13304d; }

    .key {
      flex-shrink: 0;
      margin-left: 10px;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid #74ACDF;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .playing .key { background: #fff; border-color: #fff; }

    .sparkle {
      position: absolute;
      pointer-events: none;
      -webkit-animation: sparkle 0.6s ease-out forwards;
      animation: sparkle 0.6s ease-out forwards;
    }

    @-webkit-keyframes pulse { 0%, 100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.1); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @-webkit-keyframes sparkle { to { opacity: 0; -webkit-transform: translateY(-14px) scale(1.4); } }
    @keyframes sparkle { to { opacity: 0; transform: translateY(-14px) scale(1.4); } }

    @media (max-width: 380px) {
      .logo { font-size: 1.25rem; }
      .track { padding: 9px 10px; }
      .track-number { width: 24px; height: 24px; margin-right: 10px; font-size: 0.7rem; }
      .track-title { font-size: 0.86rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { -webkit-animation: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header id="header">
    <div class="header-content">
      <div class="logo">Los Topes</div>
      <div class="subtitle"><b>Show Regreso</b>Nada ha cambiado en nuestro parque</div>
      <div class="now-title" id="nowTitle">Tocá ▶ o un tema</div>
      <div class="now-meta" id="nowMeta"></div>
      <div class="controls">
        <button type="button" class="control-btn" id="prevBtn" aria-label="Anterior">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button type="button" class="control-btn play-pause-btn" id="playPauseBtn" aria-label="Reproducir / pausar">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button type="button" class="control-btn" id="nextBtn" aria-label="Siguiente">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
      </div>
      <div class="progress" id="progress">
        <div class="progress-bar" id="progressBar">
          <div class="progress-track"></div>
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-display">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container" id="trackList"></main>

  <audio id="globalAudio" preload="none"></audio>

  <script>
  (function () {
    // n: número en la lista del show | k: tonalidad | nuevo: tema nuevo en el show
    var sections = [
      { name: "Primer acto", tracks: [
        { n: 1,  t: "Zampando tortas", a: "Los Topes", y: "2003", k: "D#Δ/G", e: "🍰", f: "1-Zampando tortas-Los Topes-2003.mp3" },
        { n: 2,  t: "Hoy 2006", a: "Los Topes", y: "2006", k: "F", e: "🌞", note: "Con intro de «Noelia»", f: "2-Hoy 2006-Los Topes-2006.mp3" },
        { n: 3,  t: "Voy buscando", a: "Nino Bravo", y: "1969", k: "E", e: "🔍", f: "3-Voy buscando-Nino Bravo-1969.mp3" },
        { n: 4,  t: "Sandra", a: "Los Topes", y: "2018", k: "C", e: "✌️", nuevo: true, f: "4-Sandra-Los Topes-2018.mp3" }
      ]},
      { name: "Segundo acto", tracks: [
        { n: 5,  t: "Paraná", a: "Los Topes", y: "2019", k: "A", e: "🏞️", nuevo: true, f: "5-Paraná-Los Topes-2019.mp3" },
        { n: 6,  t: "América", a: "Nino Bravo", y: "1973", k: "A", e: "🌎", f: "6-América-Nino Bravo-1973.mp3" },
        { n: 7,  t: "Manolo", a: "Los Topes", y: "2009", k: "G", e: "⚽", nuevo: true, f: "7-Manolo-Los Topes-2009.mp3" },
        { n: 8,  t: "Natura", a: "Los Topes", y: "2026", k: "Ebm", e: "🌿", nuevo: true, note: "Versión corta", f: "8-Natura-Los Topes-2026.mp3" },
        { n: 9,  t: "Un beso y una flor", a: "Nino Bravo", y: "1972", k: "E", e: "💐", f: "9-Un Beso Y Una Flor-Nino Bravo-1972.mp3" },
        { n: 10, t: "Ánimo", a: "Verdulería Hugo y Cristina / Los Topes", y: "2004", k: "Em", e: "⛰️", f: "10-Animo-Verdulería HyC_Los Topes-2004.mp3" },
        { n: 11, t: "Castillos en el aire", a: "Alberto Cortez", y: "1980", k: "Fm", e: "🏰", f: "11-Castillos en el aire -Alberto Cortez-1980.mp3" }
      ]},
      { name: "Tercer acto · Era Tolkien", tracks: [
        { n: 12, t: "Hobbits", a: "Los Topes", y: "2003", k: "CΔ/G → F#", e: "🧙‍♂️", f: "12-Hobbits-Los Topes-2003.mp3" },
        { n: 13, t: "Legolas", a: "Los Topes", y: "2003", k: "C → F#", e: "🏹", f: "14-Legolas-Los Topes-2003.mp3" },
        { n: 14, t: "Boromir", a: "Los Topes", y: "2003", k: "A", e: "🛡️", f: "13-Boromir-Los Topes-2003.mp3" },
        { n: 15, t: "Trancos", a: "Los Topes", y: "2003", k: "F → F#", e: "🗡️", f: "16-Trancos-Los Topes-2003.mp3" },
        { n: 16, t: "Gandaralf", a: "Los Topes", y: "2003", k: "E → F#m", e: "🧙‍♂️", f: "15-Gandaralf-Los Topes-2003.mp3" }
      ]},
      { name: "Cierre", tracks: [
        { n: 17, t: "El masón", a: "Los Topes", y: "2025", k: "E → A", e: "📐", nuevo: true, f: "17-El mason-Los Topes-2025.mp3" },
        { n: 18, t: "Un velero llamado libertad", a: "José Luis Perales", y: "1979", k: "E", e: "⛵", f: "19-Un Velero Llamado Libertad-Jose Luis Perales-1979.mp3" },
        { n: 19, t: "Intervenir", a: "Los Topes", y: "2016", k: "C", e: "🎯", nuevo: true, f: "20-intervenir-Los Topes-2016.mp3" },
        { n: 20, t: "Punk", a: "Los Topes", y: "2001/2020", k: "C", e: "Ⓐ", nuevo: true, f: "21-Punk-Los Topes-2001_2020.mp3" },
        { n: 21, t: "Las golondrinas", a: "Dávalos/Falú (versión Cafrune)", y: "1963", k: "intro A → D", e: "🕊️", f: "22-Las golondrinas-Dávalos_Falú(versión Cafrune)-1963.mp3" },
        { n: 22, t: "¿Cover en inglés?" },
        { n: 23, t: "Somos Topes", a: "Los Topes", y: "2004", k: "G", e: "👥", f: "24-Somos Topes- Los Topes-2004.mp3" }
      ]},
      { name: "Posible bis", tracks: [
        { n: 24, t: "El mundo es feliz", a: "Los Topes", y: "2003", k: "C", e: "🌍", f: "25-(bis)El mundo es feliz-Los Topes-2003.mp3" }
      ]},
      { name: "Final", tracks: [
        { n: 25, t: "Campestre", a: "Los Topes", y: "2003", k: "Am", e: "🌾", note: "Instrumental + despedida", f: "26-Final campestre-Los Topes-2003.mp3" }
      ]},
      { name: "Extras", note: "Grabaciones que no están en la lista del show", extra: true, tracks: [
        { t: "Burrito", a: "Los Topes", y: "2020", e: "🐴", f: "8-Burrito-Los Topes-2020.mp3" },
        { t: "Camello" }
      ]}
    ];

    var BASE = "../mp3/setlist/";
    var tracks = [];
    var rowEls = [];
    var current = -1;

    var $ = function (id) { return document.getElementById(id); };
    var header = $("header");
    var list = $("trackList");
    var nowTitle = $("nowTitle");
    var nowMeta = $("nowMeta");
    var playPauseBtn = $("playPauseBtn");
    var progress = $("progress");
    var progressBar = $("progressBar");
    var progressFill = $("progressFill");
    var currentTimeEl = $("currentTime");
    var durationEl = $("duration");
    var audio = $("globalAudio");

    function pad2(x) { return x < 10 ? "0" + x : "" + x; }

    function formatTime(s) {
      if (!isFinite(s) || s < 0) return "0:00";
      return Math.floor(s / 60) + ":" + pad2(Math.floor(s % 60));
    }

    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function render() {
      var html = [];
      for (var s = 0; s < sections.length; s++) {
        var sec = sections[s];
        html.push('<h2 class="act">' + esc(sec.name) + '</h2>');
        if (sec.note) html.push('<span class="act-note">' + esc(sec.note) + '</span>');
        for (var j = 0; j < sec.tracks.length; j++) {
          var tr = sec.tracks[j];
          if (!tr.f) { // tema de la lista sin grabación: solo texto, no se reproduce
            html.push(
              '<div class="track text-only">' +
                '<div class="track-number">' + (tr.n ? pad2(tr.n) : '·') + '</div>' +
                '<div class="track-info"><div class="track-title">' + esc(tr.t) + '</div></div>' +
              '</div>'
            );
            continue;
          }
          var i = tracks.length;
          tracks.push(tr);
          html.push(
            '<div class="track' + (sec.extra ? ' extra' : '') + '" data-i="' + i + '" role="button" tabindex="0">' +
              '<div class="track-number">' + (tr.n ? pad2(tr.n) : '·') + '</div>' +
              '<div class="track-info">' +
                '<div class="track-title">' + esc(tr.t) + ' ' + tr.e +
                  (tr.nuevo ? '<span class="badge-new">nuevo</span>' : '') + '</div>' +
                '<div class="track-meta">' + esc(tr.a) + ' · ' + esc(tr.y) + '</div>' +
                (tr.note ? '<div class="track-note">' + esc(tr.note) + '</div>' : '') +
              '</div>' +
              (tr.k ? '<span class="key" title="Tonalidad">' + esc(tr.k) + '</span>' : '') +
            '</div>'
          );
        }
      }
      list.innerHTML = html.join("");
      var nodes = list.getElementsByTagName("div");
      for (var n = 0; n < nodes.length; n++) {
        if (nodes[n].className.indexOf("track") === 0 && nodes[n].getAttribute("data-i") !== null) {
          rowEls[+nodes[n].getAttribute("data-i")] = nodes[n];
        }
      }
    }

    function fitHeader() {
      document.body.style.paddingTop = header.offsetHeight + "px";
    }

    function safePlay() {
      var p = audio.play();
      if (p && typeof p.then === "function") p.then(null, function () {});
    }

    function updateMediaSession(tr) {
      if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: tr.t, artist: tr.a, album: "Los Topes - Show Regreso" });
      } catch (e) {}
    }

    function setPlaybackState(state) {
      if (!("mediaSession" in navigator)) return;
      try { navigator.mediaSession.playbackState = state; } catch (e) {}
    }

    // barra de progreso en pantalla bloqueada, notificación y auto
    function updatePosition() {
      if (!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
      if (!isFinite(audio.duration) || audio.duration <= 0) return;
      try {
        navigator.mediaSession.setPositionState({
          duration: audio.duration,
          playbackRate: audio.playbackRate || 1,
          position: Math.min(audio.currentTime, audio.duration)
        });
      } catch (e) {}
    }

    function scrollToRow(el) {
      var r = el.getBoundingClientRect();
      var top = header.offsetHeight;
      if (r.top < top || r.bottom > (window.innerHeight || document.documentElement.clientHeight)) {
        var y = (window.pageYOffset || document.documentElement.scrollTop) + r.top - top - 12;
        window.scrollTo(0, y);
      }
    }

    function playTrack(index, scroll) {
      if (index < 0 || index >= tracks.length) return;
      if (current >= 0) rowEls[current].className = rowEls[current].className.replace(" playing", "");
      current = index;
      var tr = tracks[index];
      var row = rowEls[index];
      row.className += " playing";

      audio.src = BASE + encodeURIComponent(tr.f);
      safePlay();

      document.title = tr.e + " " + tr.t + " - Los Topes";
      nowTitle.textContent = tr.e + " " + tr.t;
      nowMeta.textContent = tr.a + " · " + tr.y;
      progress.className = "progress show";
      progressFill.style.webkitTransform = progressFill.style.transform = "scaleX(0)";
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";
      updateMediaSession(tr);
      if (scroll) scrollToRow(row);
    }

    function togglePlayPause() {
      if (current < 0) playTrack(0, true);
      else if (audio.paused) safePlay();
      else audio.pause();
    }

    function playNext() { playTrack((current + 1) % tracks.length, true); }
    function playPrev() {
      // como en cualquier reproductor: si ya avanzó, vuelve al inicio del tema
      if (current >= 0 && audio.currentTime > 3) { audio.currentTime = 0; return; }
      playTrack((Math.max(current, 0) - 1 + tracks.length) % tracks.length, true);
    }

    function rowFromEvent(e) {
      var el = e.target || e.srcElement;
      while (el && el !== list) {
        if (el.getAttribute && el.getAttribute("data-i") !== null) return el;
        el = el.parentNode;
      }
      return null;
    }

    function sparkle(row, e) {
      if (e.clientX === undefined || (e.clientX === 0 && e.clientY === 0)) return;
      var r = row.getBoundingClientRect();
      var star = document.createElement("span");
      star.className = "sparkle";
      star.textContent = "✨";
      star.style.left = (e.clientX - r.left - 8) + "px";
      star.style.top = (e.clientY - r.top - 10) + "px";
      row.appendChild(star);
      setTimeout(function () { if (star.parentNode) star.parentNode.removeChild(star); }, 650);
    }

    render();
    fitHeader();
    window.addEventListener("resize", fitHeader);
    window.addEventListener("load", fitHeader); // por si la fuente cambia la altura

    list.addEventListener("click", function (e) {
      var row = rowFromEvent(e);
      if (!row) return;
      playTrack(+row.getAttribute("data-i"), false);
      sparkle(row, e);
    });
    list.addEventListener("keydown", function (e) {
      if (e.keyCode !== 13 && e.keyCode !== 32) return;
      var row = rowFromEvent(e);
      if (!row) return;
      e.preventDefault();
      playTrack(+row.getAttribute("data-i"), false);
    });

    $("prevBtn").addEventListener("click", playPrev);
    $("nextBtn").addEventListener("click", playNext);
    playPauseBtn.addEventListener("click", togglePlayPause);

    audio.addEventListener("play", function () { playPauseBtn.className = "control-btn play-pause-btn is-playing"; setPlaybackState("playing"); });
    audio.addEventListener("pause", function () { playPauseBtn.className = "control-btn play-pause-btn"; setPlaybackState("paused"); });
    audio.addEventListener("seeked", updatePosition);
    audio.addEventListener("ended", playNext);
    audio.addEventListener("error", function () {
      if (current >= 0 && audio.getAttribute("src")) nowTitle.textContent = "⚠️ No se pudo cargar " + tracks[current].t;
    });
    audio.addEventListener("loadedmetadata", function () { durationEl.textContent = formatTime(audio.duration); updatePosition(); });

    var lastSecond = -1;
    audio.addEventListener("timeupdate", function () {
      if (!audio.duration) return;
      var t = audio.currentTime;
      var scale = "scaleX(" + Math.min(t / audio.duration, 1) + ")";
      progressFill.style.webkitTransform = progressFill.style.transform = scale;
      var sec = Math.floor(t);
      if (sec !== lastSecond) { lastSecond = sec; currentTimeEl.textContent = formatTime(t); }
    });

    progressBar.addEventListener("click", function (e) {
      if (!audio.duration) return;
      var r = progressBar.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      audio.currentTime = pct * audio.duration;
    });

    if ("mediaSession" in navigator) {
      var handlers = {
        play: safePlay,
        pause: function () { audio.pause(); },
        previoustrack: playPrev,
        nexttrack: playNext,
        seekto: function (d) {
          if (!audio.duration || !d || !isFinite(d.seekTime)) return;
          audio.currentTime = Math.max(0, Math.min(d.seekTime, audio.duration));
          updatePosition();
        }
        // sin seekforward/seekbackward a propósito: en iPhone reemplazan
        // los botones de tema anterior/siguiente por "±10 segundos"
      };
      for (var action in handlers) {
        try { navigator.mediaSession.setActionHandler(action, handlers[action]); } catch (e) {}
      }
    }
  })();
  </script>
</body>
